# Kenali model lock manifest
#
# Columns: name,url,sha256,licence,upstream_commit
#
# This file is COMMITTED; the weight files (*.onnx) and onnxruntime.dll are NOT.
# `cargo xtask models fetch|verify` (developer tooling, a later wave) uses these
# rows to fetch each asset into models/ and to verify its SHA-256 before any
# ONNX session is created (context_pack.md §2 item 10, §3.4).
#
# HONESTY: no weight was downloaded, hashed or executed on the Linux authoring
# host. The sha256 and upstream_commit values below are deliberately labelled
# VERIFY placeholders -- they are NOT real digests/commits and must never be
# mistaken for authoritative ones. An OWNER-RUN checklist in
# docs/reports/models.md records how to fill them from upstream in the VM.
# The URLs are plausible canonical sources but are also VERIFY (confirm the
# exact asset name/revision against upstream before relying on them).
#
# name,url,sha256,licence,upstream_commit
