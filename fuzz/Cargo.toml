[package]
name = "fuzz"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Wave 5: proptest-backed property harnesses for IPC and frame decode.
# No libfuzzer-sys: the whole workspace must type-check for the MSVC target.

[dependencies]
kenali-core = { path = "../crates/kenali-core" }
kenali-ipc = { path = "../crates/kenali-ipc" }
kenali-vision = { path = "../crates/kenali-vision" }
proptest.workspace = true

[[bin]]
name = "fuzz_ipc_decode"
path = "fuzz_targets/fuzz_ipc_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_frame_decode"
path = "fuzz_targets/fuzz_frame_decode.rs"
test = false
doc = false
