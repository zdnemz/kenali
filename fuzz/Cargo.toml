[package]
name = "fuzz"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Wave 1 keeps the fuzz crate dependency-free (no libfuzzer-sys) so the whole
# workspace type-checks for the MSVC target. Targets are empty shells for now.

[dependencies]

[[bin]]
name = "fuzz_ipc_decode"
path = "fuzz_targets/fuzz_ipc_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_frame_decode"
path = "fuzz_targets/fuzz_frame_decode.rs"
test = false
doc = false
