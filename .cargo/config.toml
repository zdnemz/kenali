[alias]
# `cargo xtask install` requires KENALI_ALLOW_INSTALL=1 (enforced by xtask).
xtask = "run --package xtask --"

[term]
verbose = false

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "target-feature=+crt-static",
    "-C", "control-flow-guard=yes",
    "-C", "link-arg=/CETCOMPAT",
]
