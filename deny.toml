# cargo-deny configuration for CI hygiene (Wave 5 wires the check into xtask).

[advisories]
yanked = "deny"
# quick-xml 0.30.0 is pulled in transitively (Linux-only) through
# eframe/egui -> accesskit. It is absent from the shipped Windows binaries,
# and upgrading it is blocked by the pinned upstream dependency graph.
ignore = [
    # Quadratic run time when checking a start tag for duplicate attribute names.
    { id = "RUSTSEC-2026-0194", reason = "Transitive Linux-only quick-xml 0.30.0 via eframe/egui/accesskit; absent from shipped Windows binaries." },
    # Unbounded namespace-declaration allocation in NsReader.
    { id = "RUSTSEC-2026-0195", reason = "Transitive Linux-only quick-xml 0.30.0 via eframe/egui/accesskit; absent from shipped Windows binaries." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
